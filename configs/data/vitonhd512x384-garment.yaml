name: VITON-HD-512x384-garment
target: patch_flow.dataloader.DataModuleFromConfig
params:
  batch_size: 4
  val_batch_size: 1
  num_workers: 4
  train:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: train
      image_size: [512, 384]
      random_flip: true
      random_shift_scale: true
      shift_scale_prob: 0.5
      shift_limit: 0.2
      scale_limit: 0.2
      paired: true
      garment_parse_labels: [5, 6, 7]
  validation:
    target: patch_flow.vton_data.VTONValidationDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      image_size: [512, 384]
      garment_parse_labels: [5, 6, 7]
      test_samples: 8
      train_samples: 4
      preview_sample_id: 00055_00.jpg
