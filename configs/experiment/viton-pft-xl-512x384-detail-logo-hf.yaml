# @package _global_
defaults:
  - viton-pft-xl-512x384-detail-semantic-hf
  - _self_

name: vton/pft-xl-512x384-detail-logo-hf

model:
  params:
    # Keep K normalized for stable routing, but let V recover spatial/channel magnitude
    # through a zero-init learned mix. Per-token LayerNorm on V was deleting the payload
    # needed to distinguish a logo from the garment's mean colour.
    garment_value_preserve_magnitude: true
    # Scale 30 made the straight-through hard coarse route almost one-hot before it
    # was correct: top-1 fell from 29.5% to 25.1% while the fine velocity collapsed.
    # Scale 10 leaves the hard forward argmax unchanged, but gives losing locations a
    # usable backward probability and keeps the 5x5 local refinement sub-pixel smooth.
    garment_refiner_cosine_scale: 10.0
    # Character strokes must follow the single coherent deformation grid. A second
    # global A@V path averages unrelated cloth locations and turns text into glyph-like
    # texture. The parameter remains checkpoint-compatible but is frozen and unused.
    garment_high_frequency_global_attention: false
    garment_refiner_global_attention: false
    # All value heads transport different channel groups through one physical cloth
    # deformation. Per-head grids produced incoherent concatenated logo features.
    garment_refiner_shared_sampling_grid: true
    # Enforce the authority bound inside every sampler call, not only through a train
    # loss. The learned spatial gate remains free to place detail, but the total AC
    # residual cannot exceed 10% of backbone RMS.
    garment_refiner_velocity_max_backbone_ratio: 0.10
    garment_refiner_velocity_min_limit: 0.05
    # HF energy is warped by the same garment grid and becomes a detached spatial gate.
    # Keep 25% authority away from explicit strokes so color-block interiors can still
    # be refined; logo/text neighbourhoods receive up to full authority.
    garment_refiner_detail_activity_floor: 0.25

trainer:
  params:
    # DINO remains a teacher only. Run it at 48x36 patches and preserve that denser cloth
    # key grid instead of asking a 32x24 observation to identify tiny logo regions.
    correspondence_teacher_input_size: [768, 576]
    correspondence_garment_grid: [48, 36]

    # Preserve the existing broad routing objective, but normalize an additional loss
    # over active RGB-DoG/gradient pixels so a small logo cannot vanish inside a shirt.
    hf_source_consistency_weight: 0.25
    hf_source_sparse_weight: 0.25
    hf_sparse_activity_threshold: 0.04
    hf_sparse_support_radius: 3

    # HF is fused into the coherently warped RGB garment features, then the ONE refiner
    # velocity head reconstructs the residual. Keep this auxiliary latent term below the
    # main flow loss; the previous weight 1.0 made the former standalone HF velocity
    # dominate training and grow into an edge overlay.
    # This was numerically identical to detail_loss after RGB+HF fusion, so keeping both
    # counted the same edge-weighted objective twice and drove edge/color divergence.
    hf_detail_loss_weight: 0.0

    # The main latent reconstruction remains a weak stabilizer; decoded RGB/chroma below
    # now carry more weight than edges.
    detail_loss_weight: 0.1
    detail_edge_weight: 2.0
    decoded_rgb_weight: 1.0
    decoded_edge_weight: 0.10
    # t=0 is the actual first sampling state and 35% of training examples are forced to
    # pure noise there. Excluding it from decoded RGB taught refinement only when xt
    # already leaked target appearance.
    decoded_min_time: 0.0
    # Full-edit RGB preserves arms/pose, but garment colour occupied too little of that
    # denominator: test RGB worsened 9.5% while edge improved. Add garment-only absolute,
    # low-pass and channel-mean terms using paired masks only (never inference inputs).
    decoded_garment_rgb_weight: 1.0
    decoded_garment_low_frequency_weight: 1.0
    decoded_garment_mean_weight: 2.0
    decoded_low_frequency_scale: 8
    fine_rgb_weight: 0.5

    # Decode the joint RGB+HF refiner estimate. RGB keeps ink colour, opponent chroma
    # keeps colour blocks, and edge keeps letter boundaries. One sample caps frozen-VAE
    # activation memory on a 24 GB GPU.
    # Raised from 0.1. This term decodes the refiner's own estimate, so it is the most
    # targeted place to charge the branch for growing in a smooth direction -- which is
    # exactly how it grew: displacement and warp smoothness both rose with the velocity.
    # decoded_edge_weight and detail_loss_weight are deliberately left alone; the RGB and
    # chroma emphasis is the intended design and the velocity guard above is what
    # actually bounds the magnitude.
    hf_decoded_rgb_weight: 1.0
    hf_decoded_contrast_weight: 1.0
    hf_decoded_chroma_weight: 1.0
    hf_decoded_edge_weight: 0.10
    hf_decoded_max_samples: 1

    # Sized as a regulator, not a disaster catcher. Measured on T004330: fine velocity
    # RMS sat at 0.062 while the LR was still ramping, then took off the moment warmup
    # completed at step 500 -- 0.099 (471), 0.200 (518), 0.325 (565), doubling every
    # ~50 steps. Every other fine metric degraded in lockstep, because they all measure
    # the same growing residual: value loss 0.0313 -> 0.0388, warp smoothness 0.0137 ->
    # 0.0145, warp mask 0.0088 -> 0.0148, displacement 0.840 -> 0.911, and it leaked
    # into flow_loss 0.4354 -> 0.4520.
    fine_velocity_regularization_weight: 2.0
    fine_velocity_max_backbone_ratio: 0.10
    fine_velocity_min_limit: 0.05

    # Both newly coupled branches were previously trained at 1e-4 while the backbone
    # used 1e-5. Use the stable rate for fusion/refinement as well.
    # The router was receiving only 7e-6 at step 700 and its top-1 accuracy regressed.
    # A quarter-rate adapter remains below the full garment attention LR while allowing
    # the corrected, non-saturated routing signal to move Q/K during this warm restart.
    garment_refiner_lr_multiplier: 0.25
    garment_high_frequency_lr_multiplier: 0.1
    # Three bounded zero-init scalars are safe at the base 1e-4 LR; putting them in
    # the 1e-5 adapter group would open the corrected V payload only ~0.01 after 1k steps.
    garment_value_mix_lr_multiplier: 1.0
    # x_embedder and every garment cross-attention adapter were still at 1e-4, ten
    # times the backbone/refiner. The common RGB dark shift began as that warmup reached
    # full LR. This warm start already has trained DensePose/garment adapters, so keep
    # all conditioning paths at the stable 1e-5 rate.
    adapter_lr_multiplier: 0.1

    # This is a warm restart from a trained checkpoint, so only ramp the denser DINO
    # route briefly instead of suppressing it for another thousand optimizer steps.
    correspondence_warmup_steps: 250

data:
  params:
    # Higher-resolution teacher features plus two checkpointed VAE decodes need the
    # smaller micro-batch. Accumulation below keeps effective batch size at 32.
    batch_size: 4

lr_scheduler:
  params:
    # All backbone weights are loaded; only the corrected routing/fusion needs a short
    # optimizer warmup. Avoid multiplying a 1000-step LR ramp by another 1000-step
    # correspondence ramp, which starved the fine route quadratically.
    num_warmup_steps: 500

train_params:
  accumulate_grad_batches: 8
  # Fixed paired/swapped previews and paired garment RGB/edge measurements must be
  # frequent enough to catch a colour drift before it contaminates a long run.
  val_check_interval: 50
