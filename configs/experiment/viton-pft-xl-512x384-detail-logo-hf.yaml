# @package _global_
defaults:
  - viton-pft-xl-512x384-detail-semantic-hf
  - _self_

name: vton/pft-xl-512x384-detail-logo-hf

model:
  params:
    # Keep K normalized for stable routing, but let V recover spatial/channel magnitude
    # through a zero-init learned mix. Per-token LayerNorm on V was deleting the payload
    # needed to distinguish a logo from the garment's mean colour.
    garment_value_preserve_magnitude: true
    # The measured learned mix reached only 0.007 after 1.6k steps, so 99.3% of V was
    # still per-token LayerNorm payload. K remains normalized, but V now always uses the
    # global-RMS appearance representation that preserves colour and logo magnitude.
    garment_value_minimum_mix: 1.0
    # Scale 30 made the straight-through hard coarse route almost one-hot before it
    # was correct: top-1 fell from 29.5% to 25.1% while the fine velocity collapsed.
    # Scale 10 leaves the hard forward argmax unchanged, but gives losing locations a
    # usable backward probability and keeps the 5x5 local refinement sub-pixel smooth.
    garment_refiner_cosine_scale: 10.0
    # Character strokes must follow the single coherent deformation grid. A second
    # global A@V path averages unrelated cloth locations and turns text into glyph-like
    # texture. The parameter remains checkpoint-compatible but is frozen and unused.
    garment_high_frequency_global_attention: false
    garment_refiner_global_attention: false
    # All value heads transport different channel groups through one physical cloth
    # deformation. Per-head grids produced incoherent concatenated logo features.
    garment_refiner_shared_sampling_grid: true
    # Enforce the authority bound inside every sampler call, not only through a train
    # loss. The learned spatial gate remains free to place detail, but the total AC
    # residual cannot exceed this fraction of backbone RMS.
    # 0.10 was never the binding constraint: fine_velocity_rms sat at 0.029 against a
    # 0.124 limit for 1300 steps and fine_velocity_norm_gate logged exactly 1.0 at every
    # step, i.e. the branch suppressed itself and the clamp never fired. The hard cap is
    # the safety mechanism -- it runs inside the sampler -- so it can be loosened while
    # the soft penalty that actually pinned the branch is reduced below.
    garment_refiner_velocity_max_backbone_ratio: 0.30
    garment_refiner_velocity_min_limit: 0.05
    # HF energy is warped by the same garment grid and becomes a detached spatial gate.
    # Keep 25% authority away from explicit strokes so color-block interiors can still
    # be refined; logo/text neighbourhoods receive up to full authority.
    garment_refiner_detail_activity_floor: 0.25
    # The VANS-style wordmark block measures about 12x5 latent cells. A 9x9 local-mean
    # subtraction removes exactly that band, so the refiner could never fix a logo's
    # fill colour -- only its outline. Masked per-channel DC removal (always on) is
    # already enough to stop a garment-wide brightness field, so the local high-pass is
    # off. Re-enable it only with a kernel well below the smallest structure to keep.
    garment_refiner_highpass_kernel: 0

trainer:
  params:
    # DINO remains a teacher only. Run it at 48x36 patches and preserve that denser cloth
    # key grid instead of asking a 32x24 observation to identify tiny logo regions.
    correspondence_teacher_input_size: [768, 576]
    correspondence_garment_grid: [48, 36]

    # Preserve the existing broad routing objective, but normalize an additional loss
    # over active RGB-DoG/gradient pixels so a small logo cannot vanish inside a shirt.
    hf_source_consistency_weight: 0.25
    hf_source_sparse_weight: 0.25
    hf_sparse_activity_threshold: 0.04
    hf_sparse_support_radius: 3

    # HF is fused into the coherently warped RGB garment features, then the ONE refiner
    # velocity head reconstructs the residual. Keep this auxiliary latent term below the
    # main flow loss; the previous weight 1.0 made the former standalone HF velocity
    # dominate training and grow into an edge overlay.
    # This was numerically identical to detail_loss after RGB+HF fusion, so keeping both
    # counted the same edge-weighted objective twice and drove edge/color divergence.
    hf_detail_loss_weight: 0.0

    # The main latent reconstruction remains a weak stabilizer; decoded RGB/chroma below
    # now carry more weight than edges.
    detail_loss_weight: 0.1
    detail_edge_weight: 2.0
    decoded_rgb_weight: 1.0
    decoded_edge_weight: 0.5
    # t=0 is the actual first sampling state and 35% of training examples are forced to
    # pure noise there. Excluding it from decoded RGB taught refinement only when xt
    # already leaked target appearance.
    decoded_min_time: 0.0
    # predicted_clean = x_t + (1 - t) * v, so every decoded loss reaches the model
    # scaled by (1 - t) and is identically zero at t=1. That silently excluded the 25%
    # of training bought by high_time_probability -- the regime meant to write logo and
    # printed-text detail -- from all pixel supervision. Normalise it back, capped at 5x.
    decoded_clean_time_floor: 0.2
    # One decode per micro-batch sample (decoded_max_samples: 0) with a checkpointed
    # frozen VAE was a large share of the 24 s optimizer step. Two is enough signal.
    decoded_max_samples: 2
    # Full-edit RGB preserves arms/pose, but garment colour occupied too little of that
    # denominator: test RGB worsened 9.5% while edge improved. Add garment-only absolute,
    # low-pass and channel-mean terms using paired masks only (never inference inputs).
    # The previous split put 5.0 of weight on flat colour (rgb 1.0 + garment rgb 1.0 +
    # low frequency 1.0 + garment mean 2.0) against 0.10 on edges. The measured previews
    # are exactly what that asks for: paired mean luminance is within 0.004 of target
    # while within-garment contrast is down 12-26% and saturation down ~17%. Absolute
    # garment colour stays fully weighted; the two redundant low-frequency terms that
    # only restate it are cut back.
    decoded_garment_rgb_weight: 1.0
    decoded_garment_low_frequency_weight: 0.25
    decoded_garment_mean_weight: 0.5
    decoded_low_frequency_scale: 8
    fine_rgb_weight: 0.5
    # Learn the inference-time garment region from person/DensePose features. Ground-
    # truth parsing supervises this head only during training; it is never an inference
    # input. This prevents warped cloth residuals from being written onto erased arms.
    fine_support_weight: 0.25

    # Disabled. Forward-substituting DINO routing avoided the wrong-warp -> mean-colour
    # collapse, but every schedule that lets it reach zero reproduces the same collapse
    # the moment self-routing has to fly solo (measured: fine_top1_accuracy 0.36 -> 0.25
    # and decoded_garment_rgb/hf_decoded_rgb/contrast/edge all roughly tripled within
    # ~500 steps of the ratio hitting exactly 0, at both 2000 and effectively any finite
    # horizon). That is a real train/inference mismatch, not just "needs more steps": the
    # fine decoder learns to decode whatever ratio of ground-truth-vs-self routing it is
    # fed, and inference always gives it 100% self-routing regardless of the schedule.
    # Route on the model's own prediction from step 0 -- identical to inference from the
    # start, no cliff to fall off later -- and push routing correctness entirely through
    # the supervised correspondence losses below (nll/center/photometric/value), which
    # already exist and act on the same coarse/middle/detail attention. Paired with
    # correspondence_entropy_weight below as the regularizer that specifically discourages
    # the diffuse/averaged-attention shape that produces the mean-colour collapse.
    fine_teacher_forcing_start: 0.0
    fine_teacher_forcing_steps: 8000
    # Entropy of the routing/correspondence attention, penalised only on examples with
    # an intrinsically spread target. Off by default in the base experiment (0.0); with
    # forward teacher-forcing removed above, this is the substitute pressure against
    # attention going diffuse (i.e. averaging many candidate locations = mean colour)
    # instead of committing to one location the way inference-time hard routing needs.
    correspondence_entropy_weight: 0.05

    # Decode the joint RGB+HF refiner estimate. RGB keeps ink colour, opponent chroma
    # keeps colour blocks, and edge keeps letter boundaries. One sample caps frozen-VAE
    # activation memory on a 24 GB GPU.
    # Raised from 0.1. This term decodes the refiner's own estimate, so it is the most
    # targeted place to charge the branch for growing in a smooth direction -- which is
    # exactly how it grew: displacement and warp smoothness both rose with the velocity.
    # decoded_edge_weight and detail_loss_weight are deliberately left alone; the RGB and
    # chroma emphasis is the intended design and the velocity guard above is what
    # actually bounds the magnitude.
    hf_decoded_rgb_weight: 1.0
    hf_decoded_contrast_weight: 1.0
    hf_decoded_chroma_weight: 1.0
    hf_decoded_edge_weight: 0.5
    hf_decoded_max_samples: 1

    # Sized as a regulator, not a disaster catcher. On T004330 an unbounded fine
    # velocity doubled every ~50 steps once warmup completed and dragged every other
    # fine metric with it, which is why the branch is bounded at all. What actually
    # enforces that bound now is the in-sampler hard cap above, which also applies at
    # inference; this soft term only has to discourage the runaway, not prevent it.
    # Weight 2.0 on an excess-RMS penalty, against a flow loss of ~0.45, held the only
    # sub-8px garment path at 2.3% of the backbone velocity (0.029 vs 1.24) -- far too
    # small to write a letter. The in-sampler hard cap above already guarantees the
    # branch can never take over, so this stays only as a mild anti-runaway term.
    fine_velocity_regularization_weight: 0.25
    fine_velocity_max_backbone_ratio: 0.30
    fine_velocity_min_limit: 0.05

    # The refiner and the HF branch were the newest, mostly zero-initialised modules in
    # the model and also had the lowest learning rates in it (2.5e-5 and 1e-5 against a
    # 1e-4 base). Nothing about them is a loaded pretrained weight that needs protecting;
    # the backbone stays at 1e-5 because it is.
    garment_refiner_lr_multiplier: 1.0
    garment_high_frequency_lr_multiplier: 1.0
    hf_condition_encoder_lr_multiplier: 0.25
    # Three bounded zero-init scalars are safe at the base 1e-4 LR; putting them in
    # the 1e-5 adapter group would open the corrected V payload only ~0.01 after 1k steps.
    garment_value_mix_lr_multiplier: 1.0
    # The direct four-channel carrier is a tiny zero-init projection. Open it at base
    # LR; the final residual remains protected by its DC removal and hard RMS gate.
    garment_latent_fusion_lr_multiplier: 1.0
    # Tiny new segmentation head starts at p=0.75 and needs to move faster than the
    # already-trained refiner matrices; its detached output cannot game reconstruction.
    garment_support_lr_multiplier: 1.0
    # The observed RGB dark shift began when this group's warmup reached the full 1e-4,
    # so it does not go back there. 1e-5 was the over-correction: the garment cross-
    # attention that has to learn where the cloth goes was then training no faster than
    # the frozen-in-place pretrained backbone. 2.5e-5 is 2.5x the stalled rate and still
    # four times below the rate with measured colour damage.
    adapter_lr_multiplier: 0.25

    # Garment is already a spatial condition. CFG 1.5 amplified its colour residual
    # (especially blue) and worsened edges in the fixed-sample ablation.
    sample_kwargs:
      num_steps: 30
      cfg_scale: 1.0
      adaptive: false
      progress: false

    # This is a warm restart from a trained checkpoint, so only ramp the denser DINO
    # route briefly instead of suppressing it for another thousand optimizer steps.
    correspondence_warmup_steps: 250

    # Correspondence supervision needs the full attention matrix, which disables fused
    # attention in every block it touches. The resolved config was supervising all three
    # scales in all 14 routed blocks. `middle` is the least region-separable of the
    # three and is the documented one to drop.
    correspondence_scales: [coarse, detail]

data:
  params:
    # Higher-resolution teacher features plus two checkpointed VAE decodes need the
    # smaller micro-batch. Accumulation below keeps effective batch size at 32.
    batch_size: 4

lr_scheduler:
  params:
    # All backbone weights are loaded; only the corrected routing/fusion needs a short
    # optimizer warmup. Avoid multiplying a 1000-step LR ramp by another 1000-step
    # correspondence ramp, which starved the fine route quadratically.
    num_warmup_steps: 500

checkpoint_params:
  # This experiment needs one long uninterrupted run, not another 1.5k-step restart:
  # every restart so far discarded the Adam state and re-ran a 500-step LR warmup, and
  # the last one reloaded step 1000 of a run that had reached 1600. At ~24 s/step a
  # 1000-step checkpoint interval risks losing 6.7 h; 500 halves that.
  every_n_train_steps: 500

train_params:
  accumulate_grad_batches: 8
  # Fixed paired/swapped previews and paired garment RGB/edge measurements must be
  # frequent enough to catch a colour drift before it contaminates a long run, but each
  # validation samples 36 previews at 30 steps each. At ~24 s/optimizer step, every-50
  # spent roughly a tenth of the run validating; every-250 keeps that near 2%.
  val_check_interval: 250
