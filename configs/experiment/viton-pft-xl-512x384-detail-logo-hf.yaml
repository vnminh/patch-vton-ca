# @package _global_
defaults:
  - viton-pft-xl-512x384-detail-semantic-hf
  - _self_

name: vton/pft-xl-512x384-detail-logo-hf

model:
  params:
    # Character strokes must follow the single coherent deformation grid. A second
    # global A@V path averages unrelated cloth locations and turns text into glyph-like
    # texture. The parameter remains checkpoint-compatible but is frozen and unused.
    garment_high_frequency_global_attention: false
    garment_refiner_global_attention: false
    # All value heads transport different channel groups through one physical cloth
    # deformation. Per-head grids produced incoherent concatenated logo features.
    garment_refiner_shared_sampling_grid: true

trainer:
  params:
    # DINO remains a teacher only. Run it at 48x36 patches and preserve that denser cloth
    # key grid instead of asking a 32x24 observation to identify tiny logo regions.
    correspondence_teacher_input_size: [768, 576]
    correspondence_garment_grid: [48, 36]

    # Preserve the existing broad routing objective, but normalize an additional loss
    # over active RGB-DoG/gradient pixels so a small logo cannot vanish inside a shirt.
    hf_source_consistency_weight: 0.25
    hf_source_sparse_weight: 0.25
    hf_sparse_activity_threshold: 0.04
    hf_sparse_support_radius: 3

    # HF is fused into the coherently warped RGB garment features, then the ONE refiner
    # velocity head reconstructs the residual. Keep this auxiliary latent term below the
    # main flow loss; the previous weight 1.0 made the former standalone HF velocity
    # dominate training and grow into an edge overlay.
    # This was numerically identical to detail_loss after RGB+HF fusion, so keeping both
    # counted the same edge-weighted objective twice and drove edge/color divergence.
    hf_detail_loss_weight: 0.0

    # The main latent reconstruction remains a weak stabilizer; decoded RGB/chroma below
    # now carry more weight than edges.
    detail_loss_weight: 0.1
    detail_edge_weight: 2.0
    decoded_rgb_weight: 1.0
    decoded_edge_weight: 0.25
    fine_rgb_weight: 0.5

    # Decode the joint RGB+HF refiner estimate. RGB keeps ink colour, opponent chroma
    # keeps colour blocks, and edge keeps letter boundaries. One sample caps frozen-VAE
    # activation memory on a 24 GB GPU.
    hf_decoded_rgb_weight: 1.0
    hf_decoded_chroma_weight: 1.0
    hf_decoded_edge_weight: 0.1
    hf_decoded_max_samples: 1

    # The failed run let fine velocity grow ~67x and dominate the backbone. Keep the
    # residual below half the backbone RMS (with a small absolute floor).
    fine_velocity_regularization_weight: 0.1
    fine_velocity_max_backbone_ratio: 0.5
    fine_velocity_min_limit: 0.1

    # Both newly coupled branches were previously trained at 1e-4 while the backbone
    # used 1e-5. Use the stable rate for fusion/refinement as well.
    garment_refiner_lr_multiplier: 0.1
    garment_high_frequency_lr_multiplier: 0.1

    # This is a warm restart from a trained checkpoint, so only ramp the denser DINO
    # route briefly instead of suppressing it for another thousand optimizer steps.
    correspondence_warmup_steps: 1000

data:
  params:
    # Higher-resolution teacher features plus two checkpointed VAE decodes need the
    # smaller micro-batch. Accumulation below keeps effective batch size at 32.
    batch_size: 1

lr_scheduler:
  params:
    num_warmup_steps: 1000

train_params:
  accumulate_grad_batches: 32
  val_check_interval: 50
