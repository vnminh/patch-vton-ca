# @package _global_
defaults:
  - viton-pft-xl-512x384-garment-fix
  - _self_

name: vton/pft-xl-512x384-detail

model:
  params:
    # Backbone: 32x24 person queries AND garment keys at every routed scale.
    garment_match_query_grid: true
    # Fine branch: 64x48 person queries AND unpooled garment detail keys/values.
    # Its velocity residual remains 64x48, i.e. one output per 8x8 image region.
    garment_latent_refiner: true
    garment_refiner_width: 256
    garment_refiner_heads: 8

trainer:
  params:
    allow_new_garment_refiner: true
    decoded_rgb_weight: 0.2
    decoded_edge_weight: 0.5
    # Use refinement states, not pure noise, for decoded reconstruction losses.
    decoded_min_time: 0.3
    decoded_max_time: 0.95
    # Zero means every eligible sample. Decoding is serialized per image to cap memory.
    decoded_max_samples: 0
    decoded_checkpoint: true
    # Direct supervision for the 64x48 Q/K routing and transported garment feature.
    # A 3x3 positive key neighbourhood tolerates small DINO/garment deformation errors.
    fine_correspondence_weight: 0.2
    fine_correspondence_radius: 1
    fine_value_weight: 0.25
    fine_value_cosine_mix: 0.5
    fine_loss_chunk_size: 256

data:
  params:
    # Fine QxK loss is checkpointed in query chunks and decoded samples are serialized.
    # Person and garment both remain 512x384. Global batch remains 32.
    batch_size: 4

train_params:
  accumulate_grad_batches: 8
