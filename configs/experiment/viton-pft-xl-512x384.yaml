# @package _global_
defaults:
  - override /trainer: vton_patch_flow
  - override /data: vitonhd512x384
  - override /model: vton-pft-xl
  - override /autoencoder: sd_ae
  - override /lr_scheduler: constant

name: vton/pft-xl-512x384

model:
  params:
    gradient_checkpointing: true
    # SD-VAE encoder taps: 1/4 resolution has 256 channels, 1/2 resolution has 128.
    garment_middle_channels: 256
    garment_detail_channels: 128
    # Inject garment evidence every two blocks. Interleave scales so high-frequency
    # evidence reaches the backbone early, while retaining four coarse, four middle and
    # six detail routes overall.
    cross_attention_every: 2
    garment_scale_routes: [coarse, middle, detail, coarse, middle, detail, coarse, middle,
                            detail, coarse, middle, detail, detail, detail]

data:
  params:
    # The detail branch adds 3072 garment keys at 512x384; batch 8 x accum 4 keeps the
    # global batch at 32 within 24 GB.
    batch_size: 4
    val_batch_size: 1

trainer:
  params:
    compute_validation_metrics: false
    ema_rate: 0.9999
    train_adapters_only: false
    # Supervise every routed garment scale. Per-block and per-scale CORAL metrics are
    # logged, including middle NLL, target mass, entropy and appearance error.
    correspondence_scales: [coarse, middle, detail]
    # A shared normalised radius covers far more keys on the 64x48 detail grid than on
    # the 32x24 coarse/middle grids. Narrow it with scale so fine attention receives the
    # strongest localisation constraint while retaining some DINO correspondence tolerance.
    correspondence_nll_radius:
      coarse: 0.04
      middle: 0.03
      detail: 0.025
    # Balanced auxiliary losses. NLL/centre/entropy now supervise every head separately;
    # value aligns both direction and magnitude to a slowly moving EMA target.
    correspondence_nll_weight: 0.1
    correspondence_center_weight: 0.05
    # Per-head NLL already concentrates probability inside the small target radius.
    # Disable entropy for this experiment: it is redundant here and removes an extra
    # full-attention backward path on the 3072-key detail scale.
    correspondence_entropy_weight: 0.0
    correspondence_photometric_weight: 0.1
    correspondence_value_weight: 0.1
    correspondence_value_cosine_mix: 0.5
    correspondence_value_target_ema: 0.999
    # High-frequency target-latent edges receive 1+5=6x weight. Apply only to the 35%
    # pure-noise garment-forcing samples so this term teaches true garment reconstruction.
    detail_loss_weight: 0.5
    detail_edge_weight: 5.0
    detail_pure_noise_only: true
    correspondence_warmup_steps: 1000
    sample_kwargs:
      num_steps: 30
      cfg_scale: 1.5
      adaptive: false
      progress: false

train_params:
  max_steps: 100000
  accumulate_grad_batches: 8
  garment_grad_log_every_n_steps: 50
  limit_val_batches: 1
  val_check_interval: 100
  precision: bf16-mixed
